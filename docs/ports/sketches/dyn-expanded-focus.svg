  <rect x="16" y="598" width="948" height="30" fill="#2A2118"/>
  <text x="28" y="618" fill="#B49637" font-family="ui-sans-serif,Segoe UI,sans-serif" font-size="12">?   Minimum Phase ▾        GHOVLZ! DYN        Look 0.0 ms    A    Out 0.0 dB</text>
  <text x="16" y="656" fill="#8A8078" font-family="ui-sans-serif,Segoe UI,sans-serif" font-size="11">r2’s mid-row oscilloscope is not in this layout. dyn/main setDynShellMode hides Osc, Gon, Spec, and Scope.</text>
  <text x="16" y="678" fill="#8A8078" font-family="ui-sans-serif,Segoe UI,sans-serif" font-size="11">Up-threshold is a second drag path on the spectrum (dashed). Clip threshold is a third path, drawn only when clip drive is up.</text>
