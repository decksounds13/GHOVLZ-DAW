  <rect x="180" y="264" width="770" height="66" fill="#120F0D" stroke="#B49637"/>
  <text x="192" y="302" fill="#E8DCC8" font-family="ui-sans-serif,Segoe UI,sans-serif" font-size="12">EQ Eight — full editor, same EqView as the Device-view panel, laid out in the remaining lane rect</text>
