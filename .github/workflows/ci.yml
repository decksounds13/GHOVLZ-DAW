name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev \
            libx11-dev libxext-dev xvfb fonts-liberation
      - name: Source gate
        run: |
          python3 tools/check_no_juce.py
          python3 tools/check_no_asio_sdk.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build
      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Screenshots
        run: |
          mkdir -p shots
          xvfb-run -a ./build/bin/RELEASE/GHOVLZ\ DAW --screenshot shots --theme ghovlz-gold
      - uses: actions/upload-artifact@v4
        with:
          name: linux-frames
          path: shots

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Source gate
        run: |
          python tools/check_no_juce.py
          python tools/check_no_asio_sdk.py
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: WARP screenshots
        run: |
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          & "build/bin/RELEASE/GHOVLZ DAW.exe" --force-warp --simulate-device-lost --screenshot shots
      - uses: actions/upload-artifact@v4
        with:
          name: windows-warp-frames
          path: shots

  linux-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libx11-dev ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGHOVLZ_SANITIZER=ON -DGHOVLZ_SANITIZER_KIND=address,undefined -DGHOVLZ_RT_ABORT=ON
      - name: Build tests
        run: cmake --build build --target GhovlzTests
      - name: Test
        run: ./build/bin/DEBUG/GhovlzTests

  linux-tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libasound2-dev libx11-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGHOVLZ_SANITIZER=ON -DGHOVLZ_SANITIZER_KIND=thread -DGHOVLZ_RT_ABORT=OFF
      - name: Build tests
        run: cmake --build build --target GhovlzTests
      - name: Test
        run: ./build/bin/DEBUG/GhovlzTests
